goals_note: Продуктивность и привычки/Мои цели.md
# сбор
retro_until: 2025-10-10
retro_cap: 5000            # больше постов в ретро-окне канала: режем до retro_fallback_days
retro_fallback_days: 60
chunk: 100                 # сообщений за один шаг сборщика
request_pause: 2           # секунд между шагами
# фильтр
min_chars: 80
ad_markers: ["erid", "#реклама", "на правах рекламы", "розыгрыш", "промокод", "#ad"]
max_images: 4
min_free_gb: 10
max_keep_gb: 1           # потолок data/keep (скачанные картинки и кадры), при превышении медиа пропускаем
embed_model: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
note_threshold: 0.6        # перекрывается data/calibration.json
section_threshold: 0.45
explore_quota: 10          # постов вне тем в ночь
skip_sections: ["Скиллы на машине"]
# ночь
batch_size: 20
max_calls_per_night: 5     # калибруется на пилоте
retro_multiplier: 2.5      # пока какой-то канал не в фазе done
max_images_per_night: 10
claude_timeout: 300
router_fallback: true      # лимит Claude кончился: остаток ночи на локальном FreeLLMAPI (gemini-3.8-flash), без целей и картинок
# бот и запись
cards_per_day: 30
video_asks_per_day: 50   # вопросов «разобрать видео» в день, лучшие по совпадению первыми
cards_hour: 9
snapshot_days: 30
attachments_dir: Вложения/Telegram
router_tail_batches: 5     # сверх max_calls_per_night ещё столько батчей уходит в FreeLLMAPI (без целей и картинок), нужен router_fallback
video_calib_n: 25          # у каналов из топ-N по очереди с меньшим числом ответов видео-вопросы идут вперёд очереди
video_calib_top: 6
video_auto: off            # off | dry | on: автоответы по видео (правило в harvester/autovideo.py)
video_auto_conf: 0.9
video_auto_min_n: 8
dup_threshold: 0.90        # дубли кандидатов по cosine: замер 25.10, с 0.88 все пары оказались одним сюжетом, первая ошибка на 0.86
video_by_topic: true       # видео-вопросы по темам: карточка на тему вместо вопроса по каждому видео
topic_cards_per_day: 10    # карточек тем в день
topic_min_size: 2          # тема меньше этого размера спрашивается по одному видео
topic_review: list         # list: после проверки темы показать список и спросить; auto: сразу писать черновик
topic_check_per_night: 40  # уникальных видео за ночь (окно 01-07), Whisper по одному
topic_silent_db: -60       # тише этого Whisper не зовём (на тишине он выдаёт мусор)
topic_default_target: Фитнес и здоровье   # куда по умолчанию просится заметка по теме
topic_max_size: 40         # темы крупнее дробятся роутером на подтемы «тема: подтема», карточка только по небольшим
topic_min_free_mem_pct: 25 # проверка темы не стартует (и не продолжается между роликами), если свободной памяти меньше
