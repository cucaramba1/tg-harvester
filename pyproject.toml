[project]
name = "tg-harvester"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.31.0",
    "fastembed>=0.9.0",
    "numpy>=2.5.4",
    "ocrmac>=1.0.1",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "telethon>=1.45.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
